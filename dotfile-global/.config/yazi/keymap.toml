# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
# "$schema" = "https://yazi-rs.github.io/schemas/keymap.json"

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = ["<Enter>"]
run = "plugin smart-enter"
desc = "Enter the child directory, or open the selected file"

[[mgr.prepend_keymap]]
on = ["<Backspace>"]
run = "leave"
desc = "Go back to the parent directory"

prepend_keymap = [
    # Generic preview-scroll keys (Yazi's built-in "seek" command) - work
    # with any previewer that implements peek/seek, including glow's
    # markdown rendering (see yazi.toml) and the built-in code previewer.
    { on = ["<C-e>"], run = "seek 5" },
    { on = ["<C-y>"], run = "seek -5" },
]

[[manager.prepend_keymap]]
on   = [ "E" ]
run  = "plugin lin-decompress"
desc = "Extract the selected archive"

[[mgr.prepend_keymap]]
on   = "T"
# max-preview.yazi is deprecated (see its own README) in favor of
# toggle-pane.yazi, the official yazi-rs replacement - same key, same
# result, actively maintained.
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore preview"
