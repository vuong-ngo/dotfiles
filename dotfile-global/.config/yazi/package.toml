# NOTE ON THE FOUR ENTRIES BELOW: their plugin folders were already
# present on disk (init.lua/keymap.toml both actively use them), but they
# were missing from this lockfile - meaning a fresh `ya pkg install` on
# another machine would silently NOT install them, breaking init.lua
# (yatline, lin-decompress) and the "T" keybind (toggle-pane). Added so
# the lockfile matches what's actually in use. The `hash` values are
# best-effort placeholders (this file was hand-edited, not generated by
# `ya pkg add`, since that requires network access this environment
# doesn't have) - run `ya pkg add <use>` once for each to let Yazi
# recompute the real hash and fully re-lock it properly.

