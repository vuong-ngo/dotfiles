# ============================================================
# RANGER CONFIGURATION (Graphite Minimalist & Plugin-Free)
# Platform: Arch Linux x Wayland (Niri)
# Viewers: xdg-open (Nautilus defaults), swayimg, mpv, neovim
# ============================================================

# ------------------------------------------------------------
# 1. GENERAL & COLUMN LAYOUT
# ------------------------------------------------------------
set viewmode miller
set column_ratios 1,3,4
set show_hidden false
set confirm_on_delete multiple
set automatically_count_files true

# ------------------------------------------------------------
# 2. PREVIEWS & SCOPE
# ------------------------------------------------------------
set use_preview_script true
set preview_script ~/.config/ranger/scope.sh
set preview_images true
set preview_images_method kitty
set preview_files true
set preview_directories true
set collapse_preview true

# ------------------------------------------------------------
# 3. APPEARANCE & BORDERS
# ------------------------------------------------------------
set colorscheme default
set draw_borders both
set draw_progress_bar_in_status_bar true
set status_bar_on_top false
set draw_bookmark_borders true

# Display line numbers
set line_numbers false

# Display directory sizes in bytes
set display_size_in_main_column true
set display_size_in_status_bar true
set display_free_space_in_status_bar true

# Titlebar & Header
set update_title true
set update_tmux_title true
set shorten_title 3
set hostname_in_titlebar false
set tilde_in_titlebar true

# ------------------------------------------------------------
# 4. MOUSE & NAVIGATION
# ------------------------------------------------------------
set mouse_enabled true
set scroll_offset 8
set padding_right true
set autoupdate_cumulative_size false

# VCS / Git integration
set vcs_aware true
set vcs_backend_git local

# ------------------------------------------------------------
# 5. CUSTOM KEYBINDINGS
# ------------------------------------------------------------
# Terminal-Native Open With Menu (Shift+O, o, r)
map r chain draw_possible_programs; console open_with%space
map o chain draw_possible_programs; console open_with%space
map O chain draw_possible_programs; console open_with%space

# Fast Navigation Shortcuts
map gh cd ~
map gc cd ~/.config
map gd cd ~/Downloads
map gp cd ~/Projects
map gW cd ~/.config/wallpapers

# Quick Toggle Hidden Files
map zh toggle_option show_hidden
map <C-h> toggle_option show_hidden

# File Management Shortcuts
map dd cut
map yy copy
map pp paste
map delete console delete

# Direct App Shortcuts
map e edit
map E edit
map V shell -f swayimg %s 2>/dev/null || mpv --image-display-duration=inf %s
map M shell -f mpv --force-window %s
map X shell -f xdg-open %s
