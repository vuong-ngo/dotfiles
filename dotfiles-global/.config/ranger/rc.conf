# ============================================================
# RANGER CONFIGURATION (CLEAN & CONFLICT-FREE)
# Platform: Arch Linux / Generic Linux x Wayland / X11
# Viewers: xdg-open, swayimg, mpv, neovim, zathura
# Features: Clean 'g' Navigation, Multi-Select, Compress/Extract, Export, FZF, Tabs
# ============================================================

# ------------------------------------------------------------
# 1. GENERAL & DISPLAY SETTINGS
# ------------------------------------------------------------
set viewmode miller
set column_ratios 1,3,4
set show_hidden false
set confirm_on_delete multiple
set automatically_count_files true
set open_all_images true

# Sorting Defaults
set sort natural
set sort_reverse false
set sort_case_insensitive true
set sort_directories_first true
set sort_unicode false

# Save console history
set save_console_history true
set max_history_size 20
set max_console_history_size 50

# Filter settings
set clear_filters_on_dir_change false
set show_selection_in_titlebar true

# ------------------------------------------------------------
# 2. PREVIEWS & SCOPE
# ------------------------------------------------------------
set use_preview_script true
set preview_script ~/.config/ranger/scripts/scope.sh
set preview_images true
set preview_images_method kitty
set preview_files true
set preview_directories true
set collapse_preview true
set wrap_plaintext_previews true
set unicode_ellipsis true

# ------------------------------------------------------------
# 3. APPEARANCE & BORDERS
# ------------------------------------------------------------
set colorscheme default
set draw_borders both
set draw_progress_bar_in_status_bar true
set status_bar_on_top false
set draw_bookmark_borders true
set line_numbers false
set display_size_in_main_column true
set display_size_in_status_bar true
set display_free_space_in_status_bar true
set display_tags_in_all_columns true

set update_title true
set update_tmux_title true
set shorten_title 3
set hostname_in_titlebar false
set tilde_in_titlebar true

# ------------------------------------------------------------
# 4. MOUSE & NAVIGATION
# ------------------------------------------------------------
set mouse_enabled true
set scroll_offset 8
set padding_right true
set autoupdate_cumulative_size false

# VCS / Git integration
set vcs_aware true
set vcs_backend_git local
set vcs_backend_hg disabled
set vcs_backend_bzr disabled
set vcs_backend_svn disabled

# ------------------------------------------------------------
# 5. FAST DIRECTORY NAVIGATION ('g' NAMESPACE ONLY FOR CD)
# ------------------------------------------------------------
map gg move to=0
map G move to=-1
map gh cd ~
map gc cd ~/.config
map gd cd ~/Downloads
map gp cd ~/Projects
map gw cd ~/.config/wallpapers
map gW cd ~/.config/wallpapers
map gr cd /
map g/ cd /
map ge cd /etc
map gm cd /media
map gM cd /mnt
map gi eval fm.cd('/run/media/' + os.getenv('USER'))
map go cd /opt
map gs cd /srv
map gu cd /usr
map gv cd /var
map gl cd -r .
map gL cd -r %f

# ------------------------------------------------------------
# 6. TAB MANAGEMENT (CLEAN CTRL / TAB KEYS - NO 'g' CONFLICTS)
# ------------------------------------------------------------
map <C-n> tab_new
map <C-w> tab_close
map <TAB> tab_move 1
map <S-TAB> tab_move -1
map uqt tab_restore

# ------------------------------------------------------------
# 7. MULTI-SELECT & MARKING (CHỌN NHIỀU FILE/FOLDER)
# ------------------------------------------------------------
map <Space> mark_files toggle=True
map V toggle_visual_mode
map uV toggle_visual_mode reverse=True

map va mark_files val=True all=True
map <C-a> mark_files val=True all=True
map uv mark_files val=False all=True
map <C-d> mark_files val=False all=True

map vt mark_files toggle=True all=True
map vi mark_files toggle=True all=True

map vm console mark%space
map vs console mark%space
map um console unmark%space

map t tag_toggle
map ut tag_remove

# ------------------------------------------------------------
# 8. COMPRESSION (NÉN FILE/FOLDER)
# ------------------------------------------------------------
map cz console compress %s.zip
map cg console compress %s.tar.gz
map ct console compress %s.tar
map cx console compress %s.tar.xz
map c7 console compress %s.7z
map cc console compress%space

# ------------------------------------------------------------
# 9. EXTRACTION (GIẢI NÉN FILE)
# ------------------------------------------------------------
map ex extract
map ax extract
map eE console extract%space
map aE console extract%space

# ------------------------------------------------------------
# 10. EXPORT & CLIPBOARD (XUẤT FILE & COPY ĐƯỜNG DẪN)
# ------------------------------------------------------------
map ep console export%space
map ee console export%space

map ey export_to_clipboard paths
map yp export_to_clipboard paths
map yn export_to_clipboard names
map yd shell -f printf "%s" "%d" | wl-copy 2>/dev/null || printf "%s" "%d" | xclip -selection clipboard

# ------------------------------------------------------------
# 11. FUZZY SEARCH & NATIVE HELPERS
# ------------------------------------------------------------
map zf fzf_select
map F fzf_select
map zg fzf_ripgrep
map mkd console mkcd%space
map cM console chmod%space

# ------------------------------------------------------------
# 12. SORTING CONTROLS
# ------------------------------------------------------------
map or setsort_reverse!
map os chain set sort=size; set sort_reverse=False
map om chain set sort=mtime; set sort_reverse=False
map oc chain set sort=ctime; set sort_reverse=False
map on chain set sort=natural; set sort_reverse=False
map oe chain set sort=extension; set sort_reverse=False
map ot chain set sort=type; set sort_reverse=False

# ------------------------------------------------------------
# 13. GENERAL FILE MANAGEMENT & ACTION KEYBINDINGS
# ------------------------------------------------------------
map dd cut
map yy copy
map pp paste
map po paste overwrite=True
map pL paste_symlink relative=False
map pl paste_symlink relative=True
map delete console delete
map cw console rename%space
map a console rename%space
map A eval fm.open_console('rename ' + fm.thisfile.relative_path)
map I eval fm.open_console('rename ' + fm.thisfile.relative_path, position=7)

# Open With Menu
map r chain draw_possible_programs; console open_with%space
map o chain draw_possible_programs; console open_with%space
map O chain draw_possible_programs; console open_with%space

# Quick Toggle Options ('z' Prefix)
map zh toggle_option show_hidden
map <C-h> toggle_option show_hidden
map zi toggle_option preview_images
map zF toggle_flat

# Direct App Shortcuts
map e edit
map E edit
map View shell -f swayimg %s 2>/dev/null || mpv --image-display-duration=inf %s
map M shell -f mpv --force-window %s
map X shell -f xdg-open %s
