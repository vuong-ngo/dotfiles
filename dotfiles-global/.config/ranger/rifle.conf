# ============================================================
# RIFLE CONFIGURATION (COMPLETE & PLUGIN-FREE)
# Handles Text, Images, Media, Documents, Archives, Web
# ============================================================

# ------------------------------------------------------------
# 1. TEXT FILES & SOURCE CODE
# ------------------------------------------------------------
mime ^text, label editor = ${VISUAL:-${EDITOR:-nvim}} -- "$@"
mime ^text, label pager  = ${PAGER:-less} -- "$@"
ext py|sh|bash|zsh|lua|kdl|rasi|toml|yaml|yml|json|conf|css|html|js|ts|jsx|tsx|c|cpp|h|hpp|rs|go|md|txt|log|ini = ${VISUAL:-${EDITOR:-nvim}} -- "$@"

# ------------------------------------------------------------
# 2. DOCUMENTS & PDF
# ------------------------------------------------------------
ext pdf, has zathura, X, flag f = zathura -- "$@"
ext pdf, has evince,  X, flag f = evince -- "$@"
ext pdf, has mupdf,   X, flag f = mupdf -- "$@"
ext pdf = xdg-open "$@"

ext doc|docx|xls|xlsx|ppt|pptx|odt|ods|odp, has libreoffice, X, flag f = libreoffice "$@"
ext doc|docx|xls|xlsx|ppt|pptx|odt|ods|odp = xdg-open "$@"

# ------------------------------------------------------------
# 3. IMAGES & GRAPHICS
# ------------------------------------------------------------
mime ^image/svg, has swayimg, X, flag f = swayimg -- "$@"
mime ^image, has swayimg, X, flag f = swayimg -- "$@"
mime ^image, has imv,     X, flag f = imv -- "$@"
mime ^image, has feh,     X, flag f = feh -- "$@"
mime ^image, has mpv,     X, flag f = mpv --image-display-duration=inf -- "$@"
mime ^image = xdg-open "$@"

# ------------------------------------------------------------
# 4. AUDIO & VIDEO MEDIA
# ------------------------------------------------------------
mime ^video, has mpv, X, flag f = mpv --force-window -- "$@"
mime ^video, has vlc, X, flag f = vlc -- "$@"
mime ^video = xdg-open "$@"

mime ^audio, has mpv, terminal, flag c = mpv --no-video -- "$@"
mime ^audio, has vlc, X, flag f = vlc -- "$@"
mime ^audio = xdg-open "$@"

# ------------------------------------------------------------
# 5. ARCHIVES & COMPRESSED FILES
# ------------------------------------------------------------
ext zip|tar|gz|bz2|xz|7z|rar|zst|tgz|tbz2|txz, has atool = atool -l "$@" | ${PAGER:-less}
ext zip|tar|gz|bz2|xz|7z|rar|zst|tgz|tbz2|txz, has file-roller, X, flag f = file-roller "$@"
ext zip|tar|gz|bz2|xz|7z|rar|zst|tgz|tbz2|txz = xdg-open "$@"

# ------------------------------------------------------------
# 6. WEB & INTERNET FORMATS
# ------------------------------------------------------------
ext htm|html|xhtml, has firefox, X, flag f = firefox -- "$@"
ext htm|html|xhtml, has chromium, X, flag f = chromium -- "$@"
ext htm|html|xhtml = xdg-open "$@"

# ------------------------------------------------------------
# 7. EXECUTABLES & FALLBACKS
# ------------------------------------------------------------
mime application/x-executable = "$1"
else = xdg-open "$@"
