# ============================================================
# RIFLE CONFIGURATION (System Default & Terminal Editor Handler)
# ============================================================

# 0: System Default Application (Nautilus / xdg-open)
label system_default = xdg-open "$@"

# 1: Terminal Text Editor (nvim / vim / $EDITOR)
label editor = ${VISUAL:-${EDITOR:-nvim}} -- "$@"
mime ^text/ = ${VISUAL:-${EDITOR:-nvim}} -- "$@"
ext py|sh|bash|zsh|kdl|rasi|toml|yaml|json|conf|css|html|js|ts|c|cpp|rs|go = ${VISUAL:-${EDITOR:-nvim}} -- "$@"

# Fallback: System Default
else = xdg-open "$@"
