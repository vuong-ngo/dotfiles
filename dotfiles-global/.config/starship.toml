# ==============================================================================
# ✦ PURE GRAPHITE MINIMALIST - STARSHIP THEME ✦
# Unified with Neovim, Tmux & Terminal (Monochrome Zinc & Subtle Pastel Accents)
# ==============================================================================

add_newline = true

# Two-line clean minimalist layout:
# Line 1: Directory + Git Branch/Status + Dev Runtimes + Duration
# Line 1 (Right): Clean Time (%H:%M)
# Line 2: ❯ Prompt Character (Synced Vi-mode with Tmux modes)
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$package\
$c\
$rust\
$golang\
$nodejs\
$python\
$conda\
$java\
$docker_context\
$kubernetes\
$terraform\
$cmd_duration\
$jobs\
$battery\
$status\
$line_break\
$character"""

right_format = """$time"""

# ------------------------------------------------------------------------------
# 1. USER & HOSTNAME (SSH / Root Only)
# ------------------------------------------------------------------------------
[username]
show_always = false
style_user = "bold #e4e4e7"
style_root = "bold #f43f5e"
format = "[$user]($style)@"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold #89b4fa"

# ------------------------------------------------------------------------------
# 2. DIRECTORY (Electric Ice Cyan - Futuristic High-Contrast Aesthetic)
# ------------------------------------------------------------------------------
[directory]
format = "[󰉋 ](bold #00f5ff)[$path](bold #38bdf8)[$read_only]($read_only_style) "
style = "bold #38bdf8"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
fish_style_pwd_dir_length = 0
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "bold #f43f5e"

# ------------------------------------------------------------------------------
# 3. GIT INTEGRATION (Clean Symbols, Synced with Neovim & Tmux 󰘬)
# ------------------------------------------------------------------------------
[git_branch]
symbol = "󰘬 "
format = "[$symbol$branch]($style) "
style = "bold #c084fc"

[git_commit]
commit_hash_length = 7
format = "[$hash]($style) "
style = "bold #71717a"

[git_state]
format = "[$state $progress_current/$progress_total]($style) "
style = "bold #f9e2af"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold #f59e0b"
conflicted = "✖ "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# ------------------------------------------------------------------------------
# 4. CLOUD & INFRASTRUCTURE
# ------------------------------------------------------------------------------
[docker_context]
format = "[󰡨 $context]($style) "
style = "bold #89dceb"
only_with_files = true

[kubernetes]
format = "[󱏓 $context(-$namespace)]($style) "
style = "bold #b4befe"
disabled = false

[terraform]
format = "[󱁢 $workspace]($style) "
style = "bold #c084fc"

# ------------------------------------------------------------------------------
# 5. DEV RUNTIMES & LANGUAGES (Harmonized Pastel Accents)
# ------------------------------------------------------------------------------
[package]
format = "[󰏗 $version]($style) "
style = "bold #71717a"

[c]
format = "[ $version]($style) "
style = "bold #89b4fa"

[rust]
format = "[ $version]($style) "
style = "bold #fab387"

[golang]
format = "[ $version]($style) "
style = "bold #89dceb"

[nodejs]
format = "[󰌞 $version]($style) "
style = "bold #a6e3a1"

[python]
format = "[ $version( ($virtualenv))]($style) "
style = "bold #f9e2af"

[conda]
format = "[󱔎 $environment]($style) "
style = "bold #a6e3a1"
ignore_base = false

[java]
format = "[ $version]($style) "
style = "bold #f38ba8"

# ------------------------------------------------------------------------------
# 6. SYSTEM STATUS & DURATION
# ------------------------------------------------------------------------------
[cmd_duration]
min_time = 2_000
format = "[󱎫 $duration]($style) "
style = "bold #f9e2af"

[jobs]
symbol = "✦"
format = "[✦ $number]($style) "
style = "bold #a1a1aa"

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
format = "[$symbol$percentage]($style) "
disabled = false

[[battery.display]]
threshold = 20
style = "bold #f43f5e"

[status]
format = "[$symbol$status]($style) "
symbol = "✘ "
style = "bold #f43f5e"
disabled = false

# ------------------------------------------------------------------------------
# 7. RIGHT PROMPT (Clean Minimalist Time, No Clutter Icon)
# ------------------------------------------------------------------------------
[time]
disabled = false
time_format = "%H:%M"
format = "[$time]($style)"
style = "bold #71717a"

# ------------------------------------------------------------------------------
# 8. PROMPT CHARACTER (Synced Vi-mode with Tmux / Neovim)
# ------------------------------------------------------------------------------
[character]
success_symbol = "[❯](bold #a6e3a1) "
error_symbol = "[❯](bold #f43f5e) "
vimcmd_symbol = "[❮](bold #e4e4e7) "
vimcmd_visual_symbol = "[❮](bold #c084fc) "
vimcmd_replace_symbol = "[❮](bold #f43f5e) "
vimcmd_replace_one_symbol = "[❮](bold #89dceb) "
