# --- Terminal Color Support ---
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"

# --- General Settings ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g set-clipboard on
set -g status-position top
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -s escape-time 0

# --- Pane Border & Message Styling ---
set -g pane-border-style "fg=#27272a"
set -g pane-active-border-style "fg=#38bdf8"
set -g mode-style "bg=#c084fc,fg=#18181b,bold"
set -g message-style "bg=#f59e0b,fg=#18181b,bold"

# --- VIM-Style Navigation & Controls ---
setw -g mode-keys vi
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi a send-keys -X clear-selection
bind-key -T copy-mode-vi i send-keys -X clear-selection

bind v copy-mode
bind c kill-pane
bind B new-session
bind b new-window -c "#{pane_current_path}"

bind ( switch-client -p
bind ) switch-client -n

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key -T copy-mode-vi u send-keys -X halfpage-up
bind-key -T copy-mode-vi d send-keys -X halfpage-down

bind-key -T copy-mode-vi w send-keys -X next-word
bind-key -T copy-mode-vi b send-keys -X previous-word
bind-key -T copy-mode-vi e send-keys -X end-of-word

# Pane Resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Custom Splits
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Quick Pane Switching (Alt + h/j/k/l)
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Quick Window Switching (Alt + Shift + h/l)
bind -n M-H previous-window
bind -n M-L next-window

# Reload Config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config!"

# --- Appearance (UI - Masterpiece Dual-Tone Sharp Arrow Tabs Theme) ---
set -g status-position top
set -g status-interval 2
set -g status-justify left
set -g status-style "bg=default,fg=#f4f4f5"

# Status Left: Connected Badges (Mode  Session )
set -g status-left-length 80
set -g status-left "#{?client_prefix,#[fg=#18181b]#[bg=#f59e0b]#[bold] 󰌌 Prefix #[fg=#f59e0b]#[bg=#27272a],#{?pane_in_mode,#[fg=#18181b]#[bg=#c084fc]#[bold] 󰅍 Visual #[fg=#c084fc]#[bg=#27272a],#[fg=#18181b]#[bg=#e4e4e7]#[bold]  Normal #[fg=#e4e4e7]#[bg=#27272a]}}#[fg=#f4f4f5]#[bg=#27272a]#[bold] 󰍹 #S #[fg=#27272a]#[bg=default] "

# Window Status: Masterpiece Dual-Tone Connected Sharp Arrow Tabs
set -g window-status-current-format "#[fg=#27272a]#[bg=default]#[fg=#f4f4f5]#[bg=#27272a]#[bold]#I#[fg=#27272a]#[bg=#f4f4f5]#[fg=#18181b]#[bg=#f4f4f5]#[bold] #W#{?window_zoomed_flag, 󰁌,} #[fg=#f4f4f5]#[bg=default]"
set -g window-status-format "#[fg=#18181b]#[bg=default]#[fg=#a1a1aa]#[bg=#18181b]#I#[fg=#18181b]#[bg=#3f3f46]#[fg=#e4e4e7]#[bg=#3f3f46] #W #[fg=#3f3f46]#[bg=default]"
set -g window-status-separator " "

# Status Right: Connected Right Badges ( Time  Date)
set -g status-right-length 60
set -g status-right "#[fg=#3f3f46]#[bg=default]#[fg=#f4f4f5]#[bg=#3f3f46]#[bold] 󰥔 %H:%M #[fg=#27272a]#[bg=#3f3f46]#[fg=#a1a1aa]#[bg=#27272a] 󰃭 %d/%m/%Y "
