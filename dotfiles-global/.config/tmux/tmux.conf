# --- Terminal Color Support ---
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"

# --- General Settings ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g set-clipboard on
set -g status-position top
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -s escape-time 0

# --- Pane Border & Message Styling ---
set -g pane-border-style "fg=#18181b"
set -g pane-active-border-style "fg=#52525b"
set -g mode-style "bg=#c084fc,fg=#18181b,bold"
set -g message-style "bg=#f59e0b,fg=#18181b,bold"

# --- VIM-Style Navigation & Controls ---
setw -g mode-keys vi
set-window-option -g mode-keys vi

# Copy Mode / Visual Mode (Vi Keybindings - Active ONLY in Copy Mode)
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi q send-keys -X cancel
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Vim Movement Keys in Copy/Visual Mode
bind-key -T copy-mode-vi h send-keys -X cursor-left
bind-key -T copy-mode-vi j send-keys -X cursor-down
bind-key -T copy-mode-vi k send-keys -X cursor-up
bind-key -T copy-mode-vi l send-keys -X cursor-right
bind-key -T copy-mode-vi u send-keys -X halfpage-up
bind-key -T copy-mode-vi d send-keys -X halfpage-down
bind-key -T copy-mode-vi w send-keys -X next-word
bind-key -T copy-mode-vi b send-keys -X previous-word
bind-key -T copy-mode-vi e send-keys -X end-of-word
bind-key -T copy-mode-vi g send-keys -X history-top
bind-key -T copy-mode-vi G send-keys -X history-bottom

# Mode Activation Keys (Prefix + v or Prefix + [ to enter Visual/Copy mode)
bind v copy-mode
bind [ copy-mode
bind c kill-pane
bind B new-session
bind b new-window -c "#{pane_current_path}"

bind ( switch-client -p
bind ) switch-client -n

# Custom Splits (Prefix + | and Prefix + -)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane Switching (Prefix + h/j/k/l or Prefix + C-h/C-j/C-k/C-l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

# Fast Tab / Window Switching (Alt + Shift + H/L)
bind -n M-H previous-window
bind -n M-L next-window
bind H previous-window
bind L next-window

# Pane Resizing (Prefix + Shift + H/J/K/L - Repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload Config (Prefix + r)
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config!"

# --- Appearance (UI - Masterpiece Pure Graphite Black Theme) ---
set -g status-position top
set -g status-interval 1
set -g status-justify left
set -g status-style "bg=default,fg=#f4f4f5"

# Status Left: Distinct Mode Display (NORMAL: Pure Graphite White | PREFIX: Yellow Untouched | VISUAL: Purple Untouched)
set -g status-left-length 100
set -g status-left "#{?client_prefix,#[fg=#18181b]#[bg=#f59e0b]#[bold] 󰌌 PREFIX #[fg=#f59e0b]#[bg=#18181b],#{?pane_in_mode,#[fg=#18181b]#[bg=#c084fc]#[bold] 󰅍 VISUAL #[fg=#c084fc]#[bg=#18181b],#[fg=#18181b]#[bg=#e4e4e7]#[bold]  NORMAL #[fg=#e4e4e7]#[bg=#18181b]}}#[fg=#f4f4f5]#[bg=#18181b]#[bold] 󰍹 #S #[fg=#18181b]#[bg=default] "

# Window Status: Pure Graphite Black Pill & Arrow Tabs
set -g window-status-current-format "#[fg=#e4e4e7]#[bg=default]#[fg=#18181b]#[bg=#e4e4e7]#[bold] #I #[fg=#e4e4e7]#[bg=#27272a]#[fg=#f4f4f5]#[bg=#27272a]#[bold] #W #{?window_zoomed_flag,󰁌 ,● }#[fg=#27272a]#[bg=default]"
set -g window-status-format "#[fg=#18181b]#[bg=default]#[fg=#a1a1aa]#[bg=#18181b] #I #[fg=#18181b]#[bg=#09090b]#[fg=#a1a1aa]#[bg=#09090b] #W #[fg=#09090b]#[bg=default]"
set -g window-status-separator " "

# Status Right: Connected Graphite Right Badges ( Time  Date)
set -g status-right-length 60
set -g status-right "#[fg=#27272a]#[bg=default]#[fg=#f4f4f5]#[bg=#27272a]#[bold] 󰥔 %H:%M #[fg=#18181b]#[bg=#27272a]#[fg=#a1a1aa]#[bg=#18181b] 󰃭 %d/%m/%Y "
