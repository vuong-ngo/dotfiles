# -----------------------------------------------------
# Hyprlock Configuration - Graphite Glassmorphism with Power Menu
# -----------------------------------------------------

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
    fractional_scaling = 2
}

background {
    monitor =
    path = ~/.cache/current_wallpaper
    color = rgba(15, 15, 20, 1.0)

    # Glassmorphism blur settings
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 0.89
    brightness = 0.55
    vibrancy = 0.2
}

# --- TOP LEFT: HOST & USER INFO ---
label {
    monitor =
    text = cmd[update:10000] echo "󰌽 $USER@$(hostname)"
    color = rgba(255, 255, 255, 0.75)
    font_size = 14
    font_family = JetBrainsMono NF Medium
    position = 30, -30
    halign = left
    valign = top
}

# --- TOP RIGHT: SYSTEM STATUS (BATTERY & LAYOUT) ---
label {
    monitor =
    text = cmd[update:5000] echo "󰌌 $LAYOUT   󰁹 $(cat /sys/class/power_supply/BAT1/capacity 2>/dev/null || echo 100)%"
    color = rgba(255, 255, 255, 0.75)
    font_size = 14
    font_family = JetBrainsMono NF Medium
    position = -30, -30
    halign = right
    valign = top
}

# --- CLOCK (TIME) ---
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 100
    font_family = JetBrainsMono NF Bold
    position = 0, 190
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

# --- DATE DISPLAY ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(200, 200, 210, 0.85)
    font_size = 20
    font_family = JetBrainsMono NF
    position = 0, 105
    halign = center
    valign = center
}

# --- AVATAR FRAME ---
shape {
    monitor =
    size = 110, 110
    color = rgba(30, 30, 40, 0.6)
    border_size = 2
    border_color = rgba(255, 255, 255, 0.25)
    rounding = -1
    position = 0, 0
    halign = center
    valign = center
}

# --- AVATAR ICON ---
label {
    monitor =
    text = 󰀄
    color = rgba(255, 255, 255, 0.9)
    font_size = 50
    font_family = JetBrainsMono NF
    position = 0, 0
    halign = center
    valign = center
}

# --- USER GREETING ---
label {
    monitor =
    text = Welcome back, <b>$USER</b>
    color = rgba(220, 220, 230, 0.9)
    font_size = 16
    font_family = JetBrainsMono NF
    position = 0, -80
    halign = center
    valign = center
}

# --- PASSWORD INPUT FIELD ---
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.32
    dots_center = true

    outer_color = rgba(255, 255, 255, 0.35)
    inner_color = rgba(20, 20, 28, 0.70)
    font_color = rgba(255, 255, 255, 1.0)

    fade_on_empty = false
    rounding = 26

    placeholder_text = <span foreground="gray"><i>󰌾  Password...</i></span>
    hide_input = false

    check_color = rgba(255, 255, 255, 0.9)
    fail_color = rgba(245, 90, 90, 0.9)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position = 0, -150
    halign = center
    valign = center
}
